[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-mrag"
version = "0.1.0"
description = "A learning-oriented reimplementation of the RAG-Anything pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyMuPDF>=1.24.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
models = [
    "openai>=1.0.0",
]
local-embeddings = [
    "sentence-transformers>=5.0,<6",
]
graph = [
    "lightrag-hku<1.5",
    "openai>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
my-mrag = "my_mrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
